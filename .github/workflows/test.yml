name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history (not the default shallow clone) so the version-bump
          # check below can diff against the PR's actual base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Run tests with coverage
        run: npm run coverage

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck lib/ (JSDoc + @ts-check)
        run: npm run typecheck

      - name: Verify the extension actually builds
        shell: pwsh
        run: ./build.ps1

      - name: Warn if extension/ changed without a version bump
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff --name-only "$BASE...HEAD" | grep -q '^extension/'; then
            if git diff "$BASE...HEAD" -- extension/manifest.json | grep -q '"version"'; then
              echo "extension/ changed and manifest.json's version was bumped — looks like a release."
            else
              echo "::warning::extension/ files changed in this PR but manifest.json's version wasn't touched. If this is meant to ship, bump the version before merging."
            fi
          else
            echo "No extension/ changes in this PR — nothing to check."
          fi

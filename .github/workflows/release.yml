name: release

on:
  push:
    tags:
      - "v*.*.*"

# The workflow needs write access to create the Release.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify tag matches manifest.json version
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($manifestVersion -ne $tagVersion) {
            Write-Error "Tag $tagVersion does not match manifest.json version $manifestVersion."
            exit 1
          }
          Write-Output "Tag v$tagVersion matches manifest.json — proceeding."

      - name: Verify a changelog entry exists for this version
        shell: pwsh
        run: |
          # Two independent changelog sources of truth exist: README.md's
          # "### vX.Y.Z" sections (used below for the GitHub Release body) and
          # extension/lib/changelog.js's CHANGELOG object (read by the
          # popup's What's New panel at runtime). Nothing else keeps them in
          # sync — this is that check, run once per release so a forgotten
          # entry fails the release instead of shipping a silent gap.
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          $changelogJs = Get-Content extension/lib/changelog.js -Raw
          $needle = '"' + $tagVersion + '":'
          if (-not $changelogJs.Contains($needle)) {
            Write-Error "No CHANGELOG entry for $tagVersion in extension/lib/changelog.js (expected to find `"$tagVersion`":) — the popup's What's New panel would show nothing for this release. Add an entry before tagging."
            exit 1
          }

          $readme = Get-Content README.md -Raw
          if (-not $readme.Contains("### v$tagVersion")) {
            Write-Error "No '### v$tagVersion' section found in README.md — add a changelog entry before tagging."
            exit 1
          }

          Write-Output "Found changelog entries for v$tagVersion in both lib/changelog.js and README.md — proceeding."

      - name: Build extension zip
        shell: pwsh
        run: ./build.ps1

      - name: Extract changelog section from README into release-notes.md
        id: changelog
        shell: bash
        run: |
          TARGET="### ${{ github.ref_name }}"
          NOTES=$(awk -v target="$TARGET" '
            /^### v/ {
              if (matched) exit
              if (index($0, target) == 1) matched=1
            }
            matched
          ' README.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No changelog section found for ${{ github.ref_name }} in README.md — falling back to auto notes."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            : > release-notes.md
          else
            printf "%s\n\n---\n_Download \`gog-enhancer-webstore.zip\` below and load it as an unpacked extension, or wait for the Chrome Web Store listing._\n" "$NOTES" > release-notes.md
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi

          # Optional per-release banner — generated via
          # store/release-images/generate_release_banner.py and committed
          # before tagging (see CLAUDE.md's "Release images" section). Only
          # prepended if it exists for this exact tag; older releases and
          # any release someone forgets to generate one for just don't get
          # an image, no failure either way.
          BANNER_PATH="store/release-images/${{ github.ref_name }}.png"
          if [ -f "$BANNER_PATH" ]; then
            BANNER_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/$BANNER_PATH"
            printf '![%s banner](%s)\n\n%s\n' "${{ github.ref_name }}" "$BANNER_URL" "$(cat release-notes.md)" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.changelog.outputs.fallback == 'true' }}
          files: dist/gog-enhancer-webstore.zip
          fail_on_unmatched_files: true
